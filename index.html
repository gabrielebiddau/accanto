<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n => new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(Number(n)||0);
const today = () => new Date().toISOString().slice(0,10);
const curMonth = () => today().slice(0,7);
const daysTo = d => Math.round((new Date(d+"T12:00") - new Date(today()+"T12:00"))/864e5);
const fmtDate = d => d ? new Date(d+"T12:00").toLocaleDateString("it-IT",{day:"numeric",month:"short",year:"numeric"}) : "";
const monthName = m => new Date(m+"-15T12:00").toLocaleDateString("it-IT",{month:"long",year:"numeric"});
const num = v => Number(v)||0;

/* ---------- Dati ---------- */
const COLS = ["config","famiglia","spese","documenti","permessi","badanti","farmaci","agenda","profili"];
const S = {config:{}, famiglia:[], spese:[], documenti:[], permessi:[], badanti:[], farmaci:[], agenda:[], profili:[]};
let store, assets = null, loaded = false, offline = false, sample = null, canImg = false;

function memoryStore(){
  const data = {}, subs = {};
  const emit = c => (subs[c]||[]).forEach(cb => cb(Object.entries(data[c]||{}).map(([id,v]) => ({id,...v}))));
  return {
    subscribe(c, cb){ (subs[c] ||= []).push(cb); emit(c); },
    async add(c, v){ (data[c] ||= {})[Math.random().toString(36).slice(2)] = v; emit(c); },
    async set(c, id, v){ (data[c] ||= {})[id] = v; emit(c); },
    async del(c, id){ delete (data[c]||{})[id]; emit(c); }
  };
}
/* App installata (fuori da Claude): i dati restano sul telefono, in IndexedDB */
function idbOpen(){ return new Promise((ok, ko) => { const r = indexedDB.open("accanto", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); }
async function localStore(){
  const db = await idbOpen();
  const get = k => new Promise(ok => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => ok(q.result || {}); q.onerror = () => ok({}); });
  const put = (k, v) => new Promise((ok, ko) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = ok; t.onerror = () => ko(t.error); });
  const data = {}, subs = {};
  for (const c of COLS) data[c] = await get(c);
  const emit = c => (subs[c]||[]).forEach(cb => cb(Object.entries(data[c]).map(([id,v]) => ({id,...v}))));
  const save = async c => { await put(c, data[c]); emit(c); };
  return {

function bilancio(m){
  const list = speseDelMese(m);
  const tot = list.reduce((a,s) => a + num(s.importo), 0);
  const daPensione = list.filter(s => s.pagatoDa === "assistito").reduce((a,s) => a + num(s.importo), 0);
  const daCoprire = tot - daPensione;
  const fam = S.famiglia;
  const qsum = fam.reduce((a,f) => a + num(f.quota), 0);
  const righe = fam.map(f => {
    const q = qsum > 0 ? num(f.quota)/qsum : 1/fam.length;
    const dovuto = daCoprire * q;
    const pagato = list.filter(s => s.pagatoDa === f.id).reduce((a,s) => a + num(s.importo), 0);
    return {f, q, dovuto, pagato, saldo: pagato - dovuto};
  });
  const deb = righe.filter(r => r.saldo < -0.5).map(r => ({n:r.f.nome, v:-r.saldo}));
  const cre = righe.filter(r => r.saldo > 0.5).map(r => ({n:r.f.nome, v:r.saldo}));
  const giri = [];
  let i = 0, j = 0;
  while (i < deb.length && j < cre.length) {
    const v = Math.min(deb[i].v, cre[j].v);
    giri.push({da:deb[i].n, a:cre[j].n, v});
    deb[i].v -= v; cre[j].v -= v;
    if (deb[i].v < 0.5) i++; if (cre[j].v < 0.5) j++;
  }
  const entrate = num(S.config.assistito?.pensione) + num(S.config.assistito?.accompagnamento) + num(S.config.assistito?.altreEntrate);
  return {list, tot, daPensione, daCoprire, righe, giri, entrate};
}

  const T = raw.toUpperCase().replace(/[ \t]+/g, " ");
  const has = re => re.test(T);
  const tipi = [
    [/CARTA D.?IDENTIT|IDENTITY CARD/, "Carta d'identità", "Identità", "documento"],
    [/TESSERA SANITARIA|TESSERA EUROPEA/, "Tessera sanitaria", "Sanità", "documento"],
    [/PASSAPORTO|PASSPORT/, "Passaporto", "Identità", "documento"],
    [/PATENTE DI GUIDA|DRIVING LICEN/, "Patente di guida", "Identità", "documento"],
    [/VERBALE[\s\S]*(INVALIDIT|HANDICAP|104)|LEGGE 104|L\. ?104/, "Verbale invalidità e 104", "Invalidità e 104", "documento"],
    [/PIANO TERAPEUTICO/, "Piano terapeutico", "Sanità", "ricetta"],
    [/RICETTA|PRESCRIZIONE|SERVIZIO SANITARIO NAZIONALE/, "Ricetta medica", "Sanità", "ricetta"],
    [/ESENZIONE/, "Esenzione ticket", "Sanità", "documento"],
    [/\bISEE\b|\bDSU\b/, "Attestazione ISEE", "Fisco e ISEE", "documento"],
    [/CEDOLINO|PENSIONE/, "Cedolino della pensione", "Pensione e INPS", "documento"],
    [/DOCUMENTO COMMERCIALE|SCONTRINO|TOTALE COMPLESSIVO|\bP\.? ?IVA\b|FATTURA/, "Scontrino", "Altro", "scontrino"]
  ];
  const m = tipi.find(([re]) => has(re)) || [null, "", "Altro", "altro"];
  const [, nomeDoc, tipo] = m; let genere = m[3];
  // date
  const date = [];
  for (const x of T.matchAll(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4}|\d{2})\b/g)) {
    let [, d, mo, y] = x; d = +d; mo = +mo; y = +y; if (y < 100) y += y < 50 ? 2000 : 1900;
    if (d >= 1 && d <= 31 && mo >= 1 && mo <= 12 && y > 1900 && y < 2100) date.push({iso: `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`, at: x.index});
  }
  let scadenza = "";
  for (const kw of T.matchAll(/SCADENZA|SCAD\b|SCADE|EXPIRY|VALID[AO]? FINO|VALIDIT|REVISIONE/g)) {
    const dopo = date.find(d => d.at > kw.index && d.at - kw.index < 80);
    if (dopo) { scadenza = dopo.iso; break; }
  }
  if (!scadenza && /Identità|Sanità/.test(tipo) && genere === "documento") scadenza = date.map(d => d.iso).filter(d => d > today()).sort().pop() || "";
  // dati utili
  const note = [];
  const cf = T.replace(/ /g, "").match(/[A-Z]{6}\d{2}[A-EHLMPR-T]\d{2}[A-Z]\d{3}[A-Z]/); if (cf) note.push("Codice fiscale " + cf[0]);
  const cie = T.match(/\b[A-Z]{2}\d{5}[A-Z]{2}\b/); if (cie && nomeDoc === "Carta d'identità") note.push("Numero " + cie[0]);
  const perc = T.match(/\b(\d{2,3}) ?%/); if (perc && tipo === "Invalidità e 104") note.push("Invalidità " + perc[1] + "%");
  if (/ART\.? ?3,? ?C(OMMA)?\.? ?3/.test(T)) note.push("104 art. 3 comma 3 (grave)");
  // importo
  const soldi = s => [...s.matchAll(/(\d{1,4}(?:\.\d{3})*,\d{2}|\d{1,4}\.\d{2})\b/g)].map(x => +x[1].replace(/\.(?=\d{3})/g, "").replace(",", "."));
  const righe = T.split(/\n/);
  let importo = 0;
  const rTot = righe.find(r => /TOTALE|IMPORTO PAGATO|DA PAGARE|TOT\./.test(r) && soldi(r).length);
  if (rTot) importo = Math.max(...soldi(rTot));
  if (genere === "scontrino" && !importo) importo = Math.max(0, ...soldi(T));
  if (!m[0] && importo) genere = "scontrino";
  const cat = /FARMACIA|PARAFARMACIA/.test(T) ? "Farmaci" : /CONAD|EUROSPIN|COOP|LIDL|CARREFOUR|DESPAR|MD |PENNY|SUPERMERCATO|ALIMENTARI/.test(T) ? "Spesa alimentare" : /ENEL|ABBANOA|BOLLETTA|LUCE|GAS\b/.test(T) ? "Casa e bollette" : /SANITARI|ORTOPEDI/.test(T) ? "Ausili" : "Altro";
  const insegna = (righe.find(r => /[A-Z]{3,}/.test(r) && r.trim().length > 3) || "Scontrino").trim().slice(0, 40);
  // farmaci (righe con un dosaggio)
  const farmaci = genere === "ricetta" ? righe.filter(r => /\b\d+(?:[.,]\d+)? ?(MG|MCG|UI|ML|G)\b/.test(r) && /[A-Z]{4,}/.test(r)).slice(0, 6).map(r => ({nome: r.trim().replace(/\s+/g, " ").toLowerCase().replace(/^\w/, c => c.toUpperCase()).slice(0, 60), dose: "", orari: ""})) : [];
  const nome = nomeDoc || "";
  const riassunto = genere === "scontrino" ? `Sembra uno scontrino${importo ? " da " + eur(importo) : ""}.` : nome ? `Sembra: ${nome.toLowerCase()}.${scadenza ? " Scadenza trovata: " + fmtDate(scadenza) + "." : " Non ho trovato una scadenza."}` : "Non ho riconosciuto il tipo di documento: potete salvarlo lo stesso e scegliere il tipo a mano.";
  return {genere, riassunto,
    documento: genere === "scontrino" ? {} : {nome: nome || "Documento", tipo, scadenza, note: note.join(" · ")},
    farmaci,
    spesa: genere === "scontrino" ? {descrizione: insegna, importo, data: date[0]?.iso || today(), categoria: cat} : {}};
}

const monthPicker = () => `<label class="f" style="max-width:220px">Mese<input type="month" id="mesePick" value="${mese}"></label>`;

function blocchiQuote(b, compatto){
  if (!S.famiglia.length) return empty("Aggiungi i figli o i familiari nella sezione Famiglia per dividere le spese.");
  const giri = b.giri.length ? b.giri.map(g => `<div class="transfer"><span>${esc(g.da)}</span><span aria-hidden="true">→</span><span>${esc(g.a)}</span><span class="num" style="margin-left:auto">${eur(g.v)}</span></div>`).join("") : `<div class="transfer" style="background:var(--good-soft);color:var(--good)">Siete in pari: nessuno deve niente a nessuno.</div>`;
  const tab = `<div class="tablebox"><table><thead><tr><th>Familiare</th><th class="r">Quota</th><th class="r">Doveva</th><th class="r">Ha pagato</th><th class="r">Saldo</th></tr></thead><tbody>${b.righe.map(r => `<tr><td>${esc(r.f.nome)}</td><td class="r">${Math.round(r.q*100)}%</td><td class="r">${eur(r.dovuto)}</td><td class="r">${eur(r.pagato)}</td><td class="r" style="color:${r.saldo<-0.5?"var(--bad)":r.saldo>0.5?"var(--good)":"var(--muted)"};font-weight:600">${r.saldo>0?"+":""}${eur(r.saldo)}</td></tr>`).join("")}</tbody></table></div>`;
  return compatto ? `<div class="stack">${giri}</div>` : `<div class="stack">${tab}<h3 style="margin-top:6px">Per chiudere il mese</h3>${giri}</div>`;
}

/* ---------- Viste ---------- */
function vOggi(){
  const a = S.config.assistito || {};
  const b = bilancio(curMonth());
  const p = permessiMese(curMonth());
  const allarmi = [];
  S.documenti.forEach(d => { if (d.scadenza && daysTo(d.scadenza) <= 60) allarmi.push({d:d.scadenza, h:item("documenti", d, d.nome, "Documento · " + esc(d.dove || d.tipo || ""), pill(...statoDoc(d)))}); });
  S.farmaci.forEach(f => { if (f.finisce && daysTo(f.finisce) <= 10) { const n = daysTo(f.finisce); allarmi.push({d:f.finisce, h:item("farmaci", f, f.nome, "Farmaco da ricomprare", pill(n<0?"Finito":`Finisce tra ${n} gg`, n<=3?"bad":"warn"))}); } });
  S.agenda.forEach(e => { const n = daysTo(e.data); if (n >= 0 && n <= 14) allarmi.push({d:e.data, h:item("agenda", e, e.titolo, `${fmtDate(e.data)}${e.ora?" alle "+esc(e.ora):""}${e.chi?" · "+esc(famName(e.chi)):""}`, pill(n===0?"Oggi":n===1?"Domani":`Tra ${n} gg`, n<=1?"warn":""))}); });
  allarmi.sort((x,y) => x.d < y.d ? -1 : 1);
  return `
  <h2>${a.nome ? "Come va con " + esc(a.nome) : "Benvenuti in Accanto"}</h2>
  <p class="lead">${a.nome ? `${a.nascita ? eta(a.nascita) + " anni · " : ""}La situazione di ${monthName(curMonth())} in un colpo d'occhio.` : `Iniziate dalla sezione Famiglia: inserite i dati della persona che assistete e i figli che dividono le spese.`}</p>
  <div class="stack" style="margin-bottom:12px">
  ${installCard()}
  ${S.config.questionario ? "" : `<div class="hero-card"><h3 style="margin:0">Prima di tutto: 15 domande, 3 minuti</h3><p>Rispondete insieme su come sta e cosa le serve. Accanto vi prepara il piano: che tipo di badante cercare, quanto costa, le pratiche da avviare e gli ausili utili.</p><p><button type="button" class="btn" data-quiz>Inizia le domande</button></p></div>`}
  <div class="places">${[["Farmacia","farmacia","cross"],["Farmacia di turno","farmacia di turno","cross"],["Pronto soccorso","pronto soccorso ospedale","cross"]].map(([t,q,ic]) => `<a class="place" href="${esc(mapsUrl(q + (S.config.assistito?.indirizzo ? " vicino a " + S.config.assistito.indirizzo : " vicino a me")))}" target="_blank" rel="noopener">${icon(ic)}<div><b>${t}</b><span>La più vicina</span></div></a>`).join("")}<button type="button" class="place" data-go="vicino" style="text-align:left;font:inherit;cursor:pointer">${icon("pin")}<div><b>Altro vicino a te</b><span>Guardia medica, CAF, INPS, ASL</span></div></button></div>
  <div class="card row between"><div style="flex:1;min-width:220px"><h3 style="margin:0 0 2px">Fotografa e archivia</h3><p class="small muted" style="margin:0">Documento, ricetta o scontrino: l'app legge il testo sul telefono, trova scadenza o totale e vi propone dove salvarlo.</p></div>${scanBtn("Scatta una foto")}</div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Spese di questo mese</h3><div class="big num">${eur(b.tot)}</div>
      <p class="small muted" style="margin:4px 0 12px">${eur(b.daPensione)} pagati dal conto di ${esc(a.nome||"chi è assistito")} · ${eur(b.daCoprire)} da dividere tra i figli</p>
      ${blocchiQuote(b, true)}
      <p style="margin:12px 0 0"><button type="button" class="btn ghost" data-go="spese">Vedi il dettaglio</button></p></div>
    <div class="card"><h3>Permessi 104 del mese</h3><div class="big num">${p.usati} <span class="muted" style="font-size:18px">di 3 giorni</span></div>
      <div class="meter" style="margin:10px 0" role="img" aria-label="${p.usati} giorni usati su 3"><i style="width:${Math.min(100,p.usati/3*100)}%"></i></div>
      <p class="small muted" style="margin:0 0 12px">I 3 giorni al mese si possono dividere tra più familiari che lavorano, ma il totale per la stessa persona assistita resta 3.</p>
      <button type="button" class="btn ghost" data-add="permessi">Segna un permesso</button></div>
  </div>
  <h2 style="font-size:22px">Da tenere d'occhio</h2>
  <p class="lead">Documenti che scadono entro 60 giorni, farmaci che stanno finendo e impegni delle prossime due settimane.</p>
  <div class="list">${allarmi.length ? allarmi.map(x => x.h).join("") : empty("Niente in scadenza. Quando aggiungete documenti, farmaci e visite, gli avvisi compaiono qui.")}</div>`;
}

function vSpese(){
  const b = bilancio(mese);
  const perCat = {};
  b.list.forEach(s => perCat[s.categoria||"Altro"] = (perCat[s.categoria||"Altro"]||0) + num(s.importo));
  const copre = b.entrate && b.tot ? Math.min(100, Math.round(b.entrate/b.tot*100)) : null;
  return `
  <h2>Spese e quote</h2>
  <p class="lead">Ogni figlio segna quello che paga. A fine mese Accanto calcola chi deve dare quanto a chi, secondo le quote stabilite in famiglia.</p>
  <div class="row between" style="align-items:flex-end;margin-bottom:12px">${monthPicker()}<div class="row">${scanBtn("Fotografa lo scontrino")}${addBtn("spese","Aggiungi una spesa")}</div></div>
  <div class="grid2">
    <div class="card"><h3>${monthName(mese)}</h3><div class="big num">${eur(b.tot)}</div>
      <p class="small muted" style="margin:4px 0 0">${b.entrate ? `Le entrate di ${esc(S.config.assistito?.nome||"chi è assistito")} sono ${eur(b.entrate)} al mese${copre!==null?`: coprono il ${copre}% delle spese`:""}.` : "Inserisci pensione e accompagnamento nella sezione Famiglia per vedere quanto coprono."}</p></div>
    <div class="card"><h3>Per categoria</h3>${Object.keys(perCat).length ? `<div class="stack small">${Object.entries(perCat).sort((x,y)=>y[1]-x[1]).map(([k,v]) => `<div class="row between num"><span>${esc(k)}</span><span>${eur(v)}</span></div><div class="meter"><i style="width:${v/b.tot*100}%"></i></div>`).join("")}</div>` : empty("Nessuna spesa in questo mese.")}</div>
  </div>
  <div class="card" style="margin-top:12px"><h3>Chi deve cosa</h3>${blocchiQuote(b, false)}</div>
  <h3 style="margin-top:20px">Movimenti del mese</h3>
  <div class="list">${b.list.length ? b.list.sort((x,y)=> x.data < y.data ? 1 : -1).map(s => item("spese", s, s.descrizione, `${s.ricorrente ? "Ogni mese" : fmtDate(s.data)} · ${esc(s.categoria||"")} · pagata da ${esc(famName(s.pagatoDa))}`, `<span class="pill grey num">${eur(s.importo)}</span>`)).join("") : empty("Nessuna spesa registrata in questo mese.")}</div>`;
}

function vDocumenti(){
  const tipi = {};
  S.documenti.forEach(d => (tipi[d.tipo||"Altro"] ||= []).push(d));
  const ord = Object.keys(tipi).sort();
  return `
  <h2>Documenti</h2>
  <p class="lead">Tutti i documenti di chi assistete in un posto solo: scadenze, dove si trova l'originale${assets ? " e una foto da mostrare quando serve" : ""}.</p>
  <div class="row between" style="margin-bottom:12px"><span class="muted small">${S.documenti.length} documenti · ${S.documenti.filter(d => d.scadenza && daysTo(d.scadenza) < 0).length} scaduti</span><div class="row">${scanBtn()}${addBtn("documenti","Aggiungi a mano")}</div></div>
  ${ord.length ? ord.map(t => `<h3 style="margin-top:18px">${esc(t)}</h3><div class="list">${tipi[t].map(d => item("documenti", d, d.nome, [d.dove ? "Originale: " + esc(d.dove) : "", d.foto ? `<span class="linkish" data-foto="${esc(d.id)}">Vedi il file</span>` : ""].filter(Boolean).join(" · "), pill(...statoDoc(d)))).join("")}</div>`).join("") : empty("Iniziate da quelli che servono più spesso: carta d'identità, tessera sanitaria, verbale di invalidità e 104, esenzione ticket, ISEE.")}
  <div class="card" style="margin-top:20px"><h3>Quelli che di solito servono</h3><p class="small muted" style="margin:0">Carta d'identità · Tessera sanitaria · Verbale di invalidità civile e 104 · Esenzione ticket · ISEE sociosanitario · Piano terapeutico · Cedolino della pensione · Contratto della badante · Delega in banca o in posta · Contrassegno disabili</p></div>`;
}

function vBadante(){
  const c = S.config.contratto || {};
  const k = costoBadante(c);
  const plan = piano(S.config.questionario);
  const cm = b => compat(b, plan);
  const cand = [...S.badanti].sort((a,b) => ((cm(b)?.pct ?? 0) - (cm(a)?.pct ?? 0)) || (punteggio(b) - punteggio(a)));
  const statoCls = {"Scelta":"good","Scartata":"grey","In prova":"warn","Colloquio fissato":""};
  return `
  <h2>Badante</h2>
  <p class="lead">Il costo vero del contratto e una scheda per confrontare le candidate con gli stessi criteri.</p>
  <div class="card"><div class="row between"><h3 style="margin:0">Contratto in corso</h3><button type="button" class="btn ghost" data-add="config/contratto">${c.stipendio ? "Modifica" : "Inserisci il contratto"}</button></div>
  ${c.stipendio ? `<p class="small muted" style="margin:6px 0 10px">${esc(c.nome||"")}${c.livello?" · "+esc(c.livello):""}${c.oreSettimana?" · "+esc(c.oreSettimana)+" ore a settimana":""}${c.riposo?" · riposi: "+esc(c.riposo):""}</p>
  <div class="tablebox"><table><tbody>
    <tr><td>Stipendio</td><td class="r">${eur(k.s)}</td></tr>
    <tr><td>Contributi INPS</td><td class="r">${eur(k.contr)}</td></tr>
    <tr><td>Tredicesima, da mettere da parte</td><td class="r">${eur(k.tred)}</td></tr>
    <tr><td>TFR, da mettere da parte</td><td class="r">${eur(k.tfr)}</td></tr>
    <tr><th>Costo reale al mese</th><th class="r" style="color:var(--ink);font-size:17px">${eur(k.tot)}</th></tr>
  </tbody></table></div>
  <p class="small muted" style="margin:10px 0 0">Stima. A ogni fratello tocca circa ${S.famiglia.length ? eur(k.tot / S.famiglia.length) : "—"} al mese se dividete in parti uguali. In dichiarazione si possono dedurre i contributi versati (fino a 1.549,37 € l'anno) e detrarre il 19% della spesa per l'assistenza (fino a 2.100 €) se il reddito non supera 40.000 €.</p>` : `<p class="small muted">Stipendio, contributi, tredicesima e TFR: inserite i dati e vedete quanto costa davvero ogni mese.</p>`}</div>
  <div class="row between" style="margin:22px 0 10px"><h3 style="margin:0">Candidate a confronto</h3><div class="row"><button type="button" class="btn ghost" data-go="bacheca">${icon("search")}Cerca in zona</button>${addBtn("badanti","Aggiungi a mano")}</div></div>
  ${plan ? (plan.req.length ? `<p class="small muted" style="margin:-4px 0 10px">Ordinate prima per quanto sono adatte (${plan.req.map(k => esc(REQ[k].split(" (")[0].toLowerCase())).join(", ")}), poi per il voto del colloquio.</p>` : "") : `<p class="small muted" style="margin:-4px 0 10px">Rispondete alle domande in Altro › Il piano: le candidate verranno ordinate anche per quanto sono adatte a lei o a lui.</p>`}
  <div class="list">${cand.length ? cand.map(b => item("badanti", b, b.nome, [b.formula, b.esperienza ? b.esperienza + " anni di esperienza" : "", b.stipendio ? "chiede " + eur(b.stipendio) : "", b.referenze ? "referenze verificate" : "referenze da verificare", b.patente ? "patente" : ""].filter(Boolean).map(esc).join(" · ") + `<br>${cm(b) ? `Adatta alle vostre esigenze: <b class="num">${cm(b).pct}%</b>${cm(b).manca.length ? ` · manca: ${cm(b).manca.map(k => esc(REQ[k].split(" (")[0].toLowerCase())).join(", ")}` : ""}<br>` : ""}Voto dal colloquio <b class="num">${String(punteggio(b) || "—").replace(".", ",")}</b> su 5,5`, pill(b.stato || "Da sentire", statoCls[b.stato] ?? "grey"))).join("") : empty("Segnate ogni persona che sentite: dopo il colloquio date un voto da 1 a 5 su pazienza, esperienza, affidabilità, cucina e lingua. La lista si ordina da sola.")}</div>
  <div class="card" style="margin-top:20px"><h3>Domande da fare al colloquio</h3><ul style="margin:0;padding-left:20px" class="small">
    <li>Con che tipo di persone ha lavorato? Allettate, con demenza, in carrozzina?</li>
    <li>Posso chiamare le due famiglie precedenti? (chiamatele davvero)</li>
    <li>Ha il permesso di soggiorno valido e in regola per lavorare?</li>
    <li>Come gestirebbe un rifiuto di prendere i farmaci o di lavarsi?</li>
    <li>Sa fare iniezioni, misurare pressione e glicemia?</li>
    <li>Che riposi le servono, e dove passa le ferie?</li>
    <li>Fate un periodo di prova pagato, scritto nel contratto (per il CCNL di solito 30 giorni di lavoro effettivo).</li>
  </ul></div>`;
}

  ["congedo","Congedo straordinario retribuito","Fino a 2 anni in tutta la vita lavorativa per assistere un familiare con 104 grave."],

  ["regionali","Contributi della Regione","In Sardegna c'è il programma «Ritornare a casa Plus». Chiedere ai servizi sociali del Comune."],

  ["contrassegno","Contrassegno parcheggio disabili","Si chiede al Comune con il certificato dell'ASL."],

function vAiuti(){
  const st = S.config.pratiche || {};
  const p = permessiMese(mese);
  const perChi = {};
  p.rows.forEach(r => perChi[r.chi] = (perChi[r.chi]||0) + num(r.giorni));
  const fatte = PRATICHE.filter(([k]) => st[k] === "Fatto" || st[k] === "Non serve").length;
  return `
  <h2>104 e aiuti</h2>
  <p class="lead">Le pratiche che una famiglia di solito si perde per strada. Segnate a che punto siete, così tutti i fratelli lo sanno.</p>
  <div class="card"><div class="row between"><h3 style="margin:0">Pratiche</h3><span class="pill">${fatte} di ${PRATICHE.length} sistemate</span></div>
  ${PRATICHE.map(([k,t,d]) => `<div class="check"><div class="main"><div style="font-weight:600">${t}</div><div class="small muted">${d}</div></div><select id="pr_${k}" data-pratica="${k}" aria-label="Stato: ${esc(t)}">${["Da fare","In corso","Fatto","Non serve"].map(o => `<option ${ (st[k]||"Da fare")===o?"selected":""}>${o}</option>`).join("")}</select></div>`).join("")}
  </div>
  <div class="card" style="margin-top:12px"><div class="row between" style="align-items:flex-end">${monthPicker()}${addBtn("permessi","Segna un permesso")}</div>
  <h3 style="margin-top:14px">Permessi 104 di ${monthName(mese)}: ${p.usati} di 3 giorni</h3>
  <div class="meter" style="margin-bottom:12px"><i style="width:${Math.min(100,p.usati/3*100)}%"></i></div>
  ${p.usati > 3 ? `<p class="notice">Avete segnato più di 3 giorni: controllate, perché l'INPS ne riconosce al massimo 3 al mese per la stessa persona assistita.</p>` : ""}
  ${Object.keys(perChi).length ? `<p class="small" style="margin:0 0 10px">${Object.entries(perChi).map(([id,g]) => `${esc(famName(id))}: <b>${g}</b>`).join(" · ")}</p>` : ""}
  <div class="list">${p.rows.length ? p.rows.sort((a,b)=>a.data<b.data?-1:1).map(r => item("permessi", r, famName(r.chi), `${fmtDate(r.data)}${r.note?" · "+esc(r.note):""}`, pill(r.giorni + (num(r.giorni)===1?" giorno":" giorni")))).join("") : empty("Nessun permesso segnato in questo mese.")}</div></div>`;
}

function vSalute(){
  const prossimi = S.agenda.filter(e => daysTo(e.data) >= 0).sort((a,b) => (a.data+(a.ora||"")) < (b.data+(b.ora||"")) ? -1 : 1);
  const passati = S.agenda.filter(e => daysTo(e.data) < 0).sort((a,b) => a.data < b.data ? 1 : -1).slice(0,5);
  return `
  <h2>Salute e agenda</h2>
  <p class="lead">Farmaci, visite e turni: chi accompagna, chi passa a trovarla, quando ricomprare le medicine.</p>
  <div class="row between" style="margin-bottom:10px"><h3 style="margin:0">Farmaci</h3>${addBtn("farmaci","Aggiungi un farmaco")}</div>
  <div class="list">${S.farmaci.length ? S.farmaci.map(f => { const n = f.finisce ? daysTo(f.finisce) : null; return item("farmaci", f, f.nome, [f.dose, f.orari, f.note].filter(Boolean).map(esc).join(" · "), n===null ? "" : pill(n<0?"Finito":n<=10?`Finisce tra ${n} gg`:"Scorta ok", n<=3?"bad":n<=10?"warn":"good")); }).join("") : empty("Segnate ogni farmaco con dose e orari: finisce anche nella Scheda SOS.")}</div>
  <div class="row between" style="margin:24px 0 10px"><h3 style="margin:0">Prossimi impegni</h3>${addBtn("agenda","Aggiungi un impegno")}</div>
  <div class="list">${prossimi.length ? prossimi.map(e => item("agenda", e, e.titolo, `${fmtDate(e.data)}${e.ora?" alle "+esc(e.ora):""} · ${esc(e.tipo||"")}${e.chi?" · se ne occupa "+esc(famName(e.chi)):" · <b>nessuno assegnato</b>"}`, pill(daysTo(e.data)===0?"Oggi":daysTo(e.data)===1?"Domani":`Tra ${daysTo(e.data)} gg`, daysTo(e.data)<=1?"warn":""))).join("") : empty("Visite, analisi, turni di assistenza: mettete chi se ne occupa, così non si scopre all'ultimo che non va nessuno.")}</div>
  ${passati.length ? `<h3 style="margin-top:20px" class="muted">Ultimi passati</h3><div class="list">${passati.map(e => item("agenda", e, e.titolo, fmtDate(e.data) + (e.chi?" · "+esc(famName(e.chi)):""), "")).join("")}</div>` : ""}`;
}

  const a = S.config.assistito || {};
  const qsum = S.famiglia.reduce((s,f) => s + num(f.quota), 0);
  return `
  <h2>Famiglia</h2>
  <p class="lead">Chi è assistito e chi se ne prende cura.${local ? "" : " Per far usare l'app ai fratelli, condividete questa pagina dal menu Condividi dando il permesso di modifica (Contributor)."}</p>
  <div class="card"><div class="row between"><h3 style="margin:0">${esc(a.nome || "Persona assistita")}</h3><button type="button" class="btn ghost" data-add="config/assistito">${a.nome ? "Modifica i dati" : "Inserisci i dati"}</button></div>
  ${a.nome ? `<p class="small muted" style="margin:6px 0 0">${[a.nascita ? eta(a.nascita)+" anni" : "", a.indirizzo, a.medico ? "medico: "+a.medico : ""].filter(Boolean).map(esc).join(" · ")}</p>
  <p class="small" style="margin:8px 0 0">Entrate al mese: <b class="num">${eur(num(a.pensione)+num(a.accompagnamento)+num(a.altreEntrate))}</b> (pensione ${eur(a.pensione)}, accompagnamento ${eur(a.accompagnamento)})</p>` : `<p class="small muted">Nome, medico, allergie, farmaci ed entrate: servono per la Scheda SOS e per il calcolo delle spese.</p>`}</div>
  <div class="row between" style="margin:22px 0 10px"><h3 style="margin:0">Chi divide le spese</h3>${addBtn("famiglia","Aggiungi un familiare")}</div>
  <div class="list">${S.famiglia.length ? S.famiglia.map(f => item("famiglia", f, f.nome, [f.ruolo, f.telefono].filter(Boolean).map(esc).join(" · "), pill(qsum ? `${Math.round(num(f.quota)/qsum*100)}% delle spese` : `${Math.round(100/S.famiglia.length)}% delle spese`))).join("") : empty("Aggiungete i figli o i familiari che contribuiscono. Le quote possono essere uguali o diverse, per esempio 40% chi guadagna di più.")}</div>
  ${local ? `<div class="card" style="margin-top:22px"><h3>I vostri dati</h3><p class="small muted" style="margin:0 0 12px">Tutto resta su questo telefono. Ogni tanto salvate una copia (per esempio una volta al mese) e tenetela su Drive o in una mail: se cambiate telefono la ripristinate da qui.</p>
    <div class="row"><button type="button" class="btn" data-backup>${icon("download")}Salva una copia</button><button type="button" class="btn ghost" data-restore>Ripristina una copia</button></div></div>` : ""}
  <p class="small muted" style="margin-top:22px"><button type="button" class="btn link" data-rename style="padding:0">Cambia il tuo nome${S.config.utente?.nome ? " (" + esc(S.config.utente.nome) + ")" : ""}</button></p>`;
}

function vPiano(){
  const a = S.config.questionario;
  if (!a) return `<h2>Il vostro piano</h2>
    <p class="lead">Rispondete a 15 domande su come sta la persona che assistete. Ci vogliono 3 minuti e potete rifarle quando le cose cambiano.</p>
    <div class="hero-card"><p>Alla fine trovate: che tipo di assistenza serve e quanto costa, il profilo della badante giusta, le pratiche da avviare, gli ausili utili in casa e come organizzarvi tra fratelli.</p><p><button type="button" class="btn" data-quiz>Inizia le domande</button></p></div>`;
  const p = piano(a), b = bilancio(curMonth());
  const nome = S.config.assistito?.nome || (a.chi ? a.chi.toLowerCase() : "la persona assistita");
  const budgetMax = [1000, 1800, 2500, Infinity][qi(a,"budget")] ?? null;
  const fuori = budgetMax !== null && p.costo[0] > budgetMax;
  const li = arr => `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  return `
  <h2>Il piano per ${esc(nome)}</h2>
  <p class="lead">Costruito sulle vostre risposte del ${fmtDate(a.aggiornato)}. È un punto di partenza da discutere in famiglia e con il medico.</p>
  <div class="stack plan">
    <div class="card"><h3>Che assistenza serve</h3><p style="margin:0 0 6px;font-weight:700;font-size:18px">${esc(p.tipo)}</p><p class="small muted" style="margin:0 0 10px">${esc(p.perche)}</p>
      <div class="row between"><span>Costo indicativo al mese</span><b class="num">${eur(p.costo[0])} – ${eur(p.costo[1])}</b></div>
      ${b.entrate ? `<div class="row between small muted"><span>Entrate di ${esc(nome)} (pensione e accompagnamento)</span><span class="num">${eur(b.entrate)}</span></div>` : ""}
      ${fuori ? `<p class="notice">Il costo supera quanto avete detto di poter spendere. Partite dalle pratiche qui sotto: accompagnamento, contributi del Comune e della Regione possono coprire una parte.</p>` : ""}</div>
    <div class="card"><h3>La badante giusta per voi</h3>${p.req.length ? `<p class="small muted" style="margin:0 0 8px">Cosa deve saper fare. Chiedetelo al colloquio e segnatelo nella scheda di ogni candidata.</p>${li(p.req.map(k => REQ[k]))}` : `<p class="small muted" style="margin:0">Non servono competenze particolari: contano affidabilità e simpatia reciproca.</p>`}
      <p style="margin:10px 0 0"><button type="button" class="btn ghost" data-go="badante">Confronta le candidate</button></p></div>
    <div class="card"><h3>Pratiche da avviare</h3>${li(p.pratiche)}<p style="margin:6px 0 0"><button type="button" class="btn ghost" data-go="aiuti">Segna a che punto siete</button></p></div>
    ${p.ausili.length ? `<div class="card"><h3>Ausili e sicurezza in casa</h3>${li(p.ausili)}</div>` : ""}
    <div class="card"><h3>Organizzazione tra fratelli</h3>${li(p.fam)}</div>
    ${sample ? `<div class="card"><h3>Un parere su misura</h3><p class="small muted" style="margin:0 0 10px">Claude legge le vostre risposte e le spese e vi scrive 5 consigli per le prossime settimane.</p><div class="ai-out" id="aiOut">${esc(aiText)}</div><p style="margin:10px 0 0"><button type="button" class="btn" data-ask>Chiedi a Claude</button></p></div>` : ""}
    <p><button type="button" class="btn ghost" data-quiz>Rifai le domande</button></p>
  </div>`;
}
const VIEWS = {vicino:vVicino, bacheca:vBacheca, piano:vPiano,oggi:vOggi,spese:vSpese, documenti:vDocumenti, badante:vBadante, aiuti:vAiuti, salute:vSalute, famiglia:vFamiglia};
function render(){
  renderTabs();
  const d = new Date().toLocaleDateString("it-IT", {weekday:"long", day:"numeric", month:"long"});
  $("#helloDate").textContent = d.charAt(0).toUpperCase() + d.slice(1);
  $("#hello").textContent = store ? saluto() : "Accanto";
  if (!store || !loaded) return;
  const benv = !S.config.utente || wStep === 1;
  $("#tabs").hidden = benv; $("#top").hidden = benv; $(".foot").hidden = benv;
  if (benv) { $("#view").innerHTML = vBenvenuto(); return; }
  let banner = "";
  if (offline === "prova") banner = `<p class="notice">Modalità prova: state usando l'app senza accesso, quindi i dati non vengono salvati. Accedete a Claude per salvarli e condividerli con la famiglia.</p>`;
  else if (offline) banner = `<p class="notice">Non riesco a raggiungere i dati salvati. Quello che vedete potrebbe non essere aggiornato.</p>`;
  $("#view").innerHTML = banner + VIEWS[tab]();
}
$("#view").addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) return setTab(g.dataset.go);
  const ft = e.target.closest("[data-foto]");
  if (ft) { const d = S.documenti.find(x => x.id === ft.dataset.foto); if (d?.foto) showMsg(d.nome, d.foto.startsWith("data:image") ? `<img src="${esc(d.foto)}" alt="${esc(d.nome)}" style="width:100%;border-radius:12px">` : `<p style="margin:0"><a href="${esc(d.foto)}" target="_blank" rel="noopener">Apri il file in una nuova scheda</a></p>`); return; }
  if (e.target.closest("[data-backup]")) return backup();
  if (e.target.closest("[data-restore]")) { const i = $("#restoreInput"); i.value = ""; return i.click(); }
  if (e.target.closest("[data-install]")) { installEvt?.prompt(); installEvt = null; return; }
  if (e.target.closest("[data-hideinstall]")) { try { localStorage.setItem("accanto-noinstall", "1"); } catch {} return render(); }
  if (e.target.closest("[data-wskip]")) { safe(() => store.set("config", "utente", {nome: ""})); return; }
  if (e.target.closest("[data-wend]")) { wStep = 0; return render(); }
  if (e.target.closest("[data-badante-entra]")) { safe(() => store.set("config", "utente", {nome: "", ruolo: "badante"})).then(() => { setTab("bacheca"); openProfilo(); }); return; }
  if (e.target.closest("[data-profilo]")) return openProfilo();
  const dv = e.target.closest("[data-dove]"); if (dv) { doveCerco = dv.dataset.dove; return render(); }
  const ct = e.target.closest("[data-contatta]"); if (ct) { const p = S.profili.find(x => x.id === ct.dataset.contatta); if (p) contatta(p); return; }
  const cd = e.target.closest("[data-candida]");
  if (cd) {
    const p = S.profili.find(x => x.id === cd.dataset.candida); if (!p) return;
    const giaC = S.badanti.some(b => b.daProfilo === p.id);
    if (!giaC) { const r = {}; ["demenza","mobilizza","notte","glicemia","piaghe","dialetto","animali"].forEach(k => r["r_" + k] = !!p["r_" + k]);
      safe(() => store.add("badanti", {nome: p.nome, telefono: p.telefono, stato: "Da sentire", formula: p.formula === "Va bene tutto" ? "" : p.formula, esperienza: p.esperienza || "", stipendio: "", referenze: false, patente: !!p.patente, ...r, note: "Dalla bacheca di Accanto. " + (p.presentazione || ""), daProfilo: p.id})); }
    cd.textContent = "Aggiunta alle candidate"; cd.disabled = true; return;
  }
  if (e.target.closest("[data-rename]")) {
    showMsg("Il tuo nome", `<label class="f">Come ti chiami?<input id="rn" value="${esc(S.config.utente?.nome || "")}"></label>`, `<span></span><button type="button" class="btn" id="rnOk">Salva</button>`);
    $("#rnOk").onclick = async () => { await safe(() => store.set("config", "utente", {nome: $("#rn").value.trim()})); dlg.close(); };
    return;
  }
  if (e.target.closest("[data-scan]")) return startScan();
  if (e.target.closest("[data-quiz]")) return openQuiz();
  const ask = e.target.closest("[data-ask]"); if (ask) return askClaude(ask);
  const a = e.target.closest("[data-add]"); if (a) return openForm(a.dataset.add);
  const ed = e.target.closest("[data-edit]");
  if (ed) { const rec = S[ed.dataset.edit].find(r => r.id === ed.dataset.id); if (rec) openForm(ed.dataset.edit, rec); }
});
$("#view").addEventListener("submit", async e => {
  if (e.target.id !== "wForm") return;
  e.preventDefault();
  const nome = $("#w_nome").value.trim(), ass = $("#w_ass").value.trim();
  if (ass) { const {id, ...prev} = S.config.assistito || {}; await safe(() => store.set("config", "assistito", {...prev, nome: ass})); }
  wStep = 1;
  await safe(() => store.set("config", "utente", {nome}));
  render(); window.scrollTo(0, 0);
});
$("#view").addEventListener("change", e => {
  if (e.target.id === "mesePick" && e.target.value) { mese = e.target.value; render(); }
  if (e.target.id === "filtroZona") { filtroZona = e.target.value.trim(); render(); }
  if (e.target.id === "filtroFormula") { filtroFormula = e.target.value; render(); }
  const pr = e.target.dataset.pratica;
  if (pr) { const {id, ...rest} = S.config.pratiche || {}; safe(() => store.set("config", "pratiche", {...rest, [pr]: e.target.value})); }
});
boot();
</script>
</body></html>
